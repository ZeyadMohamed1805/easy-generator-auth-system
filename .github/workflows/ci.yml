name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 }).ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/easy_generator_auth_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easygen/shared build
      - run: pnpm --filter @easygen/shared test
      - run: pnpm --filter api test:e2e
      - run: pnpm --filter web test
      - run: pnpm --filter api build
      - run: pnpm --filter web build
